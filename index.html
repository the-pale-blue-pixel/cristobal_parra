<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>OBJ AR Viewer</title>
<style>
  :root{ --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px); --tinta:#ff2f6d; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden; background:#000; color:#fff;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; overscroll-behavior:none;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #cam{ position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; background:#000; }
  #cam.espejo{ transform:scaleX(-1); }
  canvas#gl{ position:fixed; inset:0; z-index:1; touch-action:none; }

  #info{
    position:fixed; top:calc(12px + var(--safe-t)); left:70px; right:70px; z-index:5;
    font-size:11px; letter-spacing:.08em; text-transform:uppercase; text-align:center;
    text-shadow:0 1px 6px rgba(0,0,0,.9); pointer-events:none;
  }

  #ayuda{
    position:fixed; z-index:5; left:0; right:0; bottom:calc(180px + var(--safe-b));
    text-align:center; font-size:10.5px; letter-spacing:.06em; opacity:.55;
    text-shadow:0 1px 6px #000; pointer-events:none; transition:opacity .5s;
  }
  #ayuda.oculto{ opacity:0; }

  /* control de tamaño */
  #zona-escala{
    position:fixed; z-index:6; left:26px; right:26px;
    bottom:calc(122px + var(--safe-b));
    display:flex; align-items:center; gap:12px;
  }
  #zona-escala span{ font-size:10px; letter-spacing:.1em; opacity:.7; text-shadow:0 1px 4px #000; min-width:44px; }
  #zona-escala span:last-child{ text-align:right; }
  #escala{
    -webkit-appearance:none; appearance:none; flex:1; height:30px; background:transparent;
  }
  #escala::-webkit-slider-runnable-track{ height:2px; background:rgba(255,255,255,.5); }
  #escala::-moz-range-track{ height:2px; background:rgba(255,255,255,.5); }
  #escala::-webkit-slider-thumb{
    -webkit-appearance:none; width:26px; height:26px; border-radius:50%;
    background:var(--tinta); border:2px solid #fff; margin-top:-12px;
  }
  #escala::-moz-range-thumb{ width:26px; height:26px; border-radius:50%; background:var(--tinta); border:2px solid #fff; }

  #barra{
    position:fixed; left:0; right:0; z-index:6; bottom:calc(24px + var(--safe-b));
    display:flex; align-items:center; justify-content:center; gap:26px;
  }
  .btn{
    -webkit-appearance:none; appearance:none; color:#fff; cursor:pointer;
    background:rgba(0,0,0,.45); backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.35); width:52px; height:52px;
    border-radius:50%; font-size:15px; line-height:1;
  }
  .btn:active{ transform:scale(.94); }
  #recentrar{ border-color:var(--tinta); }
  #disparador{
    width:78px; height:78px; border-radius:50%; cursor:pointer;
    background:transparent; border:3px solid #fff; padding:5px;
  }
  #disparador span{ display:block; width:100%; height:100%; border-radius:50%; background:#fff; transition:transform .12s ease; }
  #disparador:active span{ transform:scale(.86); }

  #verPanel{
    position:fixed; z-index:6; top:calc(10px + var(--safe-t)); right:14px;
    width:38px; height:38px; font-size:14px;
  }

  #inicio{
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; background:#000;
    text-align:center; padding:32px;
  }
  #inicio h1{ font-size:15px; font-weight:500; letter-spacing:.22em; margin:0; }
  #inicio p{ font-size:12px; opacity:.6; margin:0; max-width:30ch; line-height:1.7; }
  #inicio button{
    -webkit-appearance:none; appearance:none; cursor:pointer; background:var(--tinta);
    color:#000; border:0; font:inherit; font-size:13px; letter-spacing:.14em;
    text-transform:uppercase; padding:16px 34px; border-radius:999px;
  }

  #revision{ position:fixed; inset:0; z-index:30; display:none; flex-direction:column; background:#000; }
  #revision.on{ display:flex; }
  #revision img{ flex:1; min-height:0; width:100%; object-fit:contain; -webkit-touch-callout:default; }
  #accionesFoto{ display:flex; gap:12px; padding:16px 16px calc(16px + var(--safe-b)); }
  #accionesFoto button{
    -webkit-appearance:none; appearance:none; cursor:pointer; flex:1; font:inherit;
    font-size:12px; letter-spacing:.12em; text-transform:uppercase;
    padding:16px; border-radius:12px; border:0;
  }
  #guardar{ background:var(--tinta); color:#000; }
  #cerrar{ background:transparent; color:#fff; border:1px solid rgba(255,255,255,.35) !important; }
  #pista{ position:absolute; top:0; left:0; right:0; padding:14px; font-size:11px; text-align:center; opacity:.75; text-shadow:0 1px 6px #000; pointer-events:none; }

  #panel{
    position:fixed; z-index:25; inset:0; background:rgba(0,0,0,.93); display:none;
    flex-direction:column; padding:calc(20px + var(--safe-t)) 18px calc(18px + var(--safe-b));
  }
  #panel.on{ display:flex; }
  #panel h2{ font-size:12px; letter-spacing:.18em; text-transform:uppercase; margin:0 0 14px; }
  #log{
    flex:1; overflow:auto; font-size:11.5px; line-height:1.75; white-space:pre-wrap;
    word-break:break-all; border-top:1px solid rgba(255,255,255,.18); padding-top:12px;
    -webkit-overflow-scrolling:touch; touch-action:pan-y;
  }
  #log .ok{ color:#6ee7a8; }
  #log .mal{ color:#ff6b8a; }
  #log .nota{ opacity:.55; }
  #panelBotones{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  #panelBotones button, #panelBotones label{
    flex:1 1 40%; text-align:center; cursor:pointer; font:inherit; font-size:11px;
    letter-spacing:.1em; text-transform:uppercase; padding:14px 8px; border-radius:10px;
    border:1px solid rgba(255,255,255,.3); background:transparent; color:#fff;
  }
  #panelBotones label{ background:var(--tinta); color:#000; border-color:transparent; }
  #archivos{ display:none; }

  #flash{ position:fixed; inset:0; z-index:40; background:#fff; opacity:0; pointer-events:none; }
  #flash.dispara{ animation:destello .28s ease-out; }
  @keyframes destello{ from{opacity:.9} to{opacity:0} }
  @media (prefers-reduced-motion: reduce){ #flash.dispara{ animation:none; } }
</style>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.158.0/build/three.module.js" } }
</script>
</head>
<body>

<video id="cam" playsinline autoplay muted></video>
<div id="info">Iniciando…</div>
<button class="btn" id="verPanel" aria-label="Diagnóstico">?</button>

<div id="ayuda">1 dedo gira · 2 dedos mueven · pellizca para escalar</div>

<div id="zona-escala">
  <span>Tamaño</span>
  <input type="range" id="escala" min="-100" max="100" value="0" aria-label="Tamaño del modelo">
  <span id="valEscala">1.0×</span>
</div>

<div id="barra">
  <button class="btn" id="voltear" aria-label="Cambiar de cámara">⟲</button>
  <button id="disparador" aria-label="Tomar foto"><span></span></button>
  <button class="btn" id="recentrar" aria-label="Recentrar modelo">⊕</button>
</div>

<div id="inicio">
  <h1>OBJ AR VIEWER</h1>
  <p>Necesita permiso de cámara y una conexión segura (https o localhost).</p>
  <button id="btnInicio">Activar cámara</button>
</div>

<div id="panel">
  <h2>Diagnóstico del modelo</h2>
  <div id="log"></div>
  <div id="panelBotones">
    <label for="archivos">Cargar del teléfono</label>
    <button id="reintentar">Reintentar</button>
    <button id="fondoNegro">Fondo negro</button>
    <button id="limpiar">Ocultar dispersos</button>
    <button id="ocultarPanel">Cerrar</button>
  </div>
  <input type="file" id="archivos" multiple accept=".obj,.mtl,.OBJ,.MTL,image/*">
</div>

<div id="revision">
  <div id="pista"></div>
  <img id="foto" alt="Foto capturada">
  <div id="accionesFoto">
    <button id="cerrar">Volver</button>
    <button id="guardar">Guardar foto</button>
  </div>
</div>

<div id="flash"></div>

<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/OBJLoader.js';
import { MTLLoader } from 'https://unpkg.com/three@0.158.0/examples/jsm/loaders/MTLLoader.js';

const $ = (id) => document.getElementById(id);
const info = $('info');
const video = $('cam');
const log = $('log');

function anotar(txt, clase='nota'){
  const l = document.createElement('div');
  l.className = clase; l.textContent = txt;
  log.appendChild(l); log.scrollTop = log.scrollHeight;
  console.log(txt);
}
function estado(txt, ms=2600){
  info.textContent = txt;
  clearTimeout(estado._t);
  if (ms) estado._t = setTimeout(() => { info.textContent = ''; }, ms);
}

/* ---------- ESCENA ---------- */
const DISTANCIA = 2.5;             // el modelo vive siempre a esta profundidad
const scene = new THREE.Scene();

/* la cámara NO se mueve nunca: mira hacia -Z desde el origen */
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 1000);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.domElement.id = 'gl';
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.2));
const dir = new THREE.DirectionalLight(0xffffff, 1.0);
dir.position.set(2, 3, 2);
scene.add(dir);

const testigo = new THREE.Mesh(
  new THREE.BoxGeometry(0.5, 0.5, 0.5),
  new THREE.MeshBasicMaterial({ color:0xff2f6d, wireframe:true })
);
testigo.position.set(0, 0, -DISTANCIA);
scene.add(testigo);

/* ---------- MEDIDAS DE PANTALLA EN UNIDADES DEL MUNDO ---------- */
function altoVisible(d = DISTANCIA){
  return 2 * d * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2);
}
function anchoVisible(d = DISTANCIA){ return altoVisible(d) * camera.aspect; }
function unidadesPorPixel(){ return altoVisible() / innerHeight; }

/* ---------- COLOCAR EL MODELO ---------- */
let pivote = null;      // posición y rotación en el mundo
let cuerpo = null;      // el objeto centrado dentro del pivote
let escalaBase = 1;     // escala que hace que quepa en pantalla
let escalaUsuario = 1;  // multiplicador del slider y la pinza

let radioModelo = 1;      // radio del cuerpo principal en unidades del OBJ
let objetoCargado = null; // la malla tal como salió del loader

/* oculta las partes que están muy lejos del cuerpo principal y vuelve a encuadrar */
function limpiarDispersos(){
  if (!objetoCargado){ estado('Todavía no hay modelo'); return; }
  const m = medir(objetoCargado);
  let ocultas = 0;
  objetoCargado.traverse((n) => {
    if (!n.isMesh) return;
    const c = new THREE.Box3().setFromObject(n).getCenter(new THREE.Vector3());
    if (c.distanceTo(m.centro) > m.radio * 3){ n.visible = false; ocultas++; }
  });
  if (!ocultas){ estado('No hay partes dispersas que ocultar'); return; }
  anotar(`Se ocultaron ${ocultas} parte(s) dispersa(s)`, 'ok');
  const objeto = objetoCargado;
  if (pivote) scene.remove(pivote);
  colocar(objeto);
}

/* mediana y percentil 95: descartan vértices sueltos que inflan la caja */
function medir(objeto){
  objeto.updateWorldMatrix(true, true);
  const xs = [], ys = [], zs = [], puntos = [];
  const v = new THREE.Vector3();

  objeto.traverse((n) => {
    const pos = n.isMesh && n.geometry?.attributes?.position;
    if (!pos) return;
    const paso = Math.max(1, Math.floor(pos.count / 30000));   // muestreo para no colgar el teléfono
    for (let i = 0; i < pos.count; i += paso){
      v.fromBufferAttribute(pos, i).applyMatrix4(n.matrixWorld);
      puntos.push(v.x, v.y, v.z);
      xs.push(v.x); ys.push(v.y); zs.push(v.z);
    }
  });

  const mediana = (a) => { a.sort((p, q) => p - q); return a[Math.floor(a.length / 2)]; };
  const centro = new THREE.Vector3(mediana(xs), mediana(ys), mediana(zs));

  const dist = [];
  for (let i = 0; i < puntos.length; i += 3){
    dist.push(Math.hypot(puntos[i] - centro.x, puntos[i+1] - centro.y, puntos[i+2] - centro.z));
  }
  dist.sort((p, q) => p - q);

  const radio = dist[Math.floor(dist.length * 0.95)] || dist[dist.length - 1] || 1;
  const radioTotal = dist[dist.length - 1] || 1;

  const caja = new THREE.Box3().setFromObject(objeto);
  return { centro, radio, radioTotal, tam: caja.getSize(new THREE.Vector3()) };
}

/* un objeto no puede verse más grande que la pantalla: pasado ese punto la cámara queda adentro */
function escalaMaxima(){
  const radioAparente = Math.max(altoVisible(), anchoVisible()) * 0.75;
  return radioAparente / (radioModelo * escalaBase) || 20;
}

function aplicarEscala(){
  if (!cuerpo) return;
  const tope = escalaMaxima();
  let topado = false;
  if (escalaUsuario > tope){ escalaUsuario = tope; topado = true; }

  cuerpo.scale.setScalar(escalaBase * escalaUsuario);

  const ocupa = (2 * radioModelo * escalaBase * escalaUsuario) / altoVisible() * 100;
  $('valEscala').textContent = `${escalaUsuario < 1 ? escalaUsuario.toFixed(2) : escalaUsuario.toFixed(1)}× · ${Math.round(ocupa)}%`;
  if (topado) estado('Tamaño máximo: el modelo ya llena la pantalla');
}

function colocar(objeto){
  /* transformaciones a cero: así medir() siempre parte de las unidades originales */
  if (objeto.parent) objeto.parent.remove(objeto);
  objeto.position.set(0, 0, 0);
  objeto.rotation.set(0, 0, 0);
  objeto.scale.set(1, 1, 1);
  objeto.updateWorldMatrix(true, true);

  let vertices = 0;
  objeto.traverse((n) => {
    if (n.isMesh){
      vertices += n.geometry?.attributes?.position?.count || 0;
      const mats = Array.isArray(n.material) ? n.material : [n.material];
      mats.forEach((m) => {
        if (!m) return;
        m.side = THREE.DoubleSide;
        if (m.color && m.color.getHex() === 0x000000 && !m.map) m.color.setHex(0xcfcfcf);
        if ('opacity' in m && m.opacity === 0){ m.opacity = 1; m.transparent = false; }
      });
      if (!n.geometry.attributes.normal) n.geometry.computeVertexNormals();
    }
  });

  if (vertices === 0){
    anotar('El archivo se leyó pero tiene 0 vértices.', 'mal');
    return;
  }
  anotar(`Malla: ${vertices.toLocaleString('es-MX')} vértices`, 'ok');

  const m = medir(objeto);
  radioModelo = m.radio;

  anotar(`Caja completa: ${m.tam.x.toFixed(3)} × ${m.tam.y.toFixed(3)} × ${m.tam.z.toFixed(3)}`);
  anotar(`Radio del 95% de los vértices: ${m.radio.toExponential(3)}`);
  if (m.radioTotal > m.radio * 2.2){
    anotar(`Hay geometría dispersa: el radio total (${m.radioTotal.toExponential(2)}) es ${(m.radioTotal/m.radio).toFixed(1)}× mayor que el cuerpo principal. Se ignora para encuadrar.`, 'mal');
  }

  /* que el cuerpo principal ocupe el 70% del lado más corto de la pantalla */
  const objetivo = Math.min(altoVisible(), anchoVisible()) * 0.70;
  escalaBase = objetivo / (2 * m.radio);
  escalaUsuario = 1;
  $('escala').value = 0;
  anotar(`Factor de escala: ${escalaBase.toExponential(3)}`, 'ok');

  objeto.position.set(-m.centro.x, -m.centro.y, -m.centro.z);   // centro robusto, no el de la caja

  const partes = [];
  objeto.traverse(n => { if (n.isMesh) partes.push(n); });
  if (partes.length > 1){
    anotar(`El OBJ trae ${partes.length} partes:`);
    partes.slice(0, 10).forEach(n => {
      const c = new THREE.Box3().setFromObject(n).getCenter(new THREE.Vector3());
      anotar(`  · ${n.name || 'sin nombre'} — a ${c.distanceTo(m.centro).toExponential(2)} del centro`);
    });
    if (partes.length > 10) anotar(`  · … y ${partes.length - 10} más`);
  }

  objetoCargado = objeto;
  if (pivote) scene.remove(pivote);
  cuerpo = new THREE.Group();
  cuerpo.add(objeto);
  pivote = new THREE.Group();
  pivote.add(cuerpo);
  pivote.position.set(0, 0, -DISTANCIA);
  scene.add(pivote);
  aplicarEscala();

  scene.remove(testigo);
  estado('Modelo listo');
  $('panel').classList.remove('on');
  setTimeout(() => $('ayuda').classList.add('oculto'), 6000);
}

function recentrar(){
  if (!pivote){ estado('Todavía no hay modelo'); return; }
  pivote.position.set(0, 0, -DISTANCIA);
  pivote.rotation.set(0, 0, 0);
  escalaUsuario = 1;
  $('escala').value = 0;
  aplicarEscala();
  estado('Modelo recentrado');
}

/* ---------- GESTOS SOBRE EL MODELO ---------- */
const lienzoGL = renderer.domElement;
let gesto = null, ini = null;

const dedos = (e) => [...e.touches].map(t => ({ x:t.clientX, y:t.clientY }));
const separacion = (p) => Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
const medio = (p) => ({ x:(p[0].x + p[1].x)/2, y:(p[0].y + p[1].y)/2 });

lienzoGL.addEventListener('touchstart', (e) => {
  if (!pivote) return;
  const p = dedos(e);
  if (p.length === 1){
    gesto = 'girar';
    ini = { p:p[0], rx:pivote.rotation.x, ry:pivote.rotation.y };
  } else if (p.length >= 2){
    gesto = 'mover';
    ini = {
      c: medio(p), d: separacion(p),
      pos: pivote.position.clone(), esc: escalaUsuario
    };
  }
}, { passive:true });

lienzoGL.addEventListener('touchmove', (e) => {
  if (!pivote || !gesto) return;
  e.preventDefault();
  const p = dedos(e);

  if (gesto === 'girar' && p.length === 1){
    pivote.rotation.y = ini.ry + (p[0].x - ini.p.x) * 0.008;
    pivote.rotation.x = THREE.MathUtils.clamp(ini.rx + (p[0].y - ini.p.y) * 0.008, -Math.PI/2, Math.PI/2);
  }

  if (gesto === 'mover' && p.length >= 2){
    const upp = unidadesPorPixel();
    const c = medio(p);
    /* límites: el modelo no puede salir más allá de una pantalla de distancia */
    const limX = anchoVisible(), limY = altoVisible();
    pivote.position.x = THREE.MathUtils.clamp(ini.pos.x + (c.x - ini.c.x) * upp, -limX, limX);
    pivote.position.y = THREE.MathUtils.clamp(ini.pos.y - (c.y - ini.c.y) * upp, -limY, limY);

    const f = separacion(p) / (ini.d || 1);
    escalaUsuario = Math.max(0.02, ini.esc * f);
    aplicarEscala();                                       // aplica el tope si hace falta
    $('escala').value = Math.log10(escalaUsuario) * 50;     // slider logarítmico
  }
  $('ayuda').classList.add('oculto');
}, { passive:false });

lienzoGL.addEventListener('touchend', (e) => { if (!e.touches.length) gesto = null; });
lienzoGL.addEventListener('touchcancel', () => { gesto = null; });

/* ratón, para probar en computadora */
let arrastre = null;
lienzoGL.addEventListener('mousedown', (e) => {
  if (pivote) arrastre = { x:e.clientX, y:e.clientY, rx:pivote.rotation.x, ry:pivote.rotation.y };
});
addEventListener('mousemove', (e) => {
  if (!arrastre || !pivote) return;
  pivote.rotation.y = arrastre.ry + (e.clientX - arrastre.x) * 0.008;
  pivote.rotation.x = THREE.MathUtils.clamp(arrastre.rx + (e.clientY - arrastre.y) * 0.008, -Math.PI/2, Math.PI/2);
});
addEventListener('mouseup', () => { arrastre = null; });

/* slider de tamaño: −100…100 → 0.01×…100× logarítmico */
$('escala').addEventListener('input', (e) => {
  escalaUsuario = Math.pow(10, e.target.value / 50);
  aplicarEscala();
  const real = Math.log10(escalaUsuario) * 50;
  if (Math.abs(real - e.target.value) > 1) e.target.value = real;   // rebota en el tope
  $('ayuda').classList.add('oculto');
});

/* ---------- CARGA DESDE EL SERVIDOR ---------- */
const OBJ_URL = './mi_modelo.obj';
const MTL_URL = './mi_modelo.mtl';

async function revisarRuta(url){
  try{
    const r = await fetch(url, { cache:'no-store' });
    const tipo = r.headers.get('content-type') || 'sin content-type';
    if (!r.ok){ anotar(`${url} → HTTP ${r.status}`, 'mal'); return false; }
    if (/text\/html/i.test(tipo)){ anotar(`${url} → 200 pero devuelve HTML`, 'mal'); return false; }
    anotar(`${url} → HTTP ${r.status} · ${tipo}`, 'ok');
    return true;
  }catch(e){ anotar(`${url} → falló (${e.message})`, 'mal'); return false; }
}

async function cargarDesdeServidor(){
  log.innerHTML = '';
  anotar(`Origen: ${location.origin || 'file://'}`);
  anotar('—');
  const hayObj = await revisarRuta(OBJ_URL);
  const hayMtl = await revisarRuta(MTL_URL);
  if (!hayObj){
    anotar('Sube mi_modelo.obj junto al HTML o usa "Cargar del teléfono".', 'mal');
    $('panel').classList.add('on');
    return;
  }
  const cargarObj = (mats) => {
    const l = new OBJLoader();
    if (mats) l.setMaterials(mats);
    l.load(OBJ_URL, colocar, undefined, (e) => {
      anotar(`Error al leer el OBJ: ${e.message || e}`, 'mal');
      $('panel').classList.add('on');
    });
  };
  if (hayMtl){
    new MTLLoader().load(MTL_URL, (m) => { m.preload(); anotar('MTL aplicado', 'ok'); cargarObj(m); },
      undefined, () => { anotar('MTL falló; se carga sin material.', 'mal'); cargarObj(null); });
  } else { cargarObj(null); }
}

/* ---------- CARGA DESDE EL TELÉFONO ---------- */
$('archivos').addEventListener('change', async (ev) => {
  const lista = [...ev.target.files];
  if (!lista.length) return;
  log.innerHTML = '';
  anotar(`${lista.length} archivo(s) seleccionados`);

  const mapa = new Map();
  lista.forEach(f => mapa.set(f.name, URL.createObjectURL(f)));
  const manager = new THREE.LoadingManager();
  manager.setURLModifier((url) => {
    const nombre = url.split('/').pop().split('\\').pop();
    return mapa.has(nombre) ? mapa.get(nombre) : url;
  });

  const fObj = lista.find(f => /\.obj$/i.test(f.name));
  const fMtl = lista.find(f => /\.mtl$/i.test(f.name));
  if (!fObj){ anotar('No incluiste ningún .obj', 'mal'); return; }
  anotar(`OBJ: ${fObj.name} (${(fObj.size/1024).toFixed(0)} KB)`, 'ok');

  let mats = null;
  if (fMtl){
    anotar(`MTL: ${fMtl.name}`, 'ok');
    mats = new MTLLoader(manager).parse(await fMtl.text(), '');
    mats.preload();
  }
  const l = new OBJLoader(manager);
  if (mats) l.setMaterials(mats);
  try{ colocar(l.parse(await fObj.text())); }
  catch(e){ anotar(`No se pudo interpretar el OBJ: ${e.message}`, 'mal'); }
});

/* ---------- CÁMARA DEL DISPOSITIVO ---------- */
let stream = null, facing = 'environment', camaraViva = false;

async function iniciarCamara(modo = facing){
  if (!navigator.mediaDevices?.getUserMedia){ estado('Sin acceso a la cámara', 0); return false; }
  if (stream) stream.getTracks().forEach(t => t.stop());
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio:false, video:{ facingMode:{ ideal:modo }, width:{ ideal:1920 }, height:{ ideal:1080 } }
    });
    facing = modo; camaraViva = true;
    video.srcObject = stream;
    video.classList.toggle('espejo', facing === 'user');
    await video.play();
    return true;
  }catch(e){
    camaraViva = false;
    estado(location.protocol === 'https:' || location.hostname === 'localhost'
      ? 'Revisa los permisos de cámara' : 'La cámara requiere https', 0);
    return false;
  }
}

/* ---------- CAPTURA ---------- */
const lienzo = document.createElement('canvas');
const ctx = lienzo.getContext('2d');
let blobActual = null;

function componer(){
  const gl = renderer.domElement;
  lienzo.width = gl.width; lienzo.height = gl.height;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, lienzo.width, lienzo.height);
  if (camaraViva && video.videoWidth){
    const esc = Math.max(lienzo.width/video.videoWidth, lienzo.height/video.videoHeight);
    const w = video.videoWidth*esc, h = video.videoHeight*esc;
    ctx.save();
    if (facing === 'user'){ ctx.translate(lienzo.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, (lienzo.width-w)/2, (lienzo.height-h)/2, w, h);
    ctx.restore();
  }
  renderer.render(scene, camera);
  ctx.drawImage(gl, 0, 0, lienzo.width, lienzo.height);
}

function nombreArchivo(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `AR_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
}
function puedeCompartir(){
  return !!(navigator.canShare && navigator.canShare({ files:[new File([new Blob()], 'x.jpg', { type:'image/jpeg' })] }));
}

function tomarFoto(){
  componer();
  const f = $('flash');
  f.classList.remove('dispara'); void f.offsetWidth; f.classList.add('dispara');
  lienzo.toBlob((blob) => {
    if (!blob){ estado('No se pudo generar la foto'); return; }
    blobActual = blob;
    $('foto').src = URL.createObjectURL(blob);
    $('pista').textContent = puedeCompartir()
      ? 'Guardar abre la hoja para compartir'
      : 'Mantén presionada la imagen para guardarla';
    $('revision').classList.add('on');
  }, 'image/jpeg', 0.92);
}

async function guardarFoto(){
  if (!blobActual) return;
  const archivo = new File([blobActual], nombreArchivo(), { type:'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files:[archivo] })){
    try{ await navigator.share({ files:[archivo] }); return; }
    catch(e){ if (e.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blobActual);
  const a = document.createElement('a');
  a.href = url; a.download = archivo.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

/* ---------- UI ---------- */
$('btnInicio').addEventListener('click', async () => {
  const ok = await iniciarCamara();
  $('inicio').style.display = 'none';
  if (ok) estado('Cámara activa');
  cargarDesdeServidor();
});
$('disparador').addEventListener('click', tomarFoto);
$('recentrar').addEventListener('click', recentrar);
$('guardar').addEventListener('click', guardarFoto);
$('cerrar').addEventListener('click', () => {
  $('revision').classList.remove('on');
  const img = $('foto');
  if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
  img.removeAttribute('src'); blobActual = null;
});
$('voltear').addEventListener('click', () => iniciarCamara(facing === 'environment' ? 'user' : 'environment'));
$('verPanel').addEventListener('click', () => $('panel').classList.add('on'));
$('ocultarPanel').addEventListener('click', () => $('panel').classList.remove('on'));
$('reintentar').addEventListener('click', cargarDesdeServidor);
$('limpiar').addEventListener('click', limpiarDispersos);
$('fondoNegro').addEventListener('click', (e) => {
  video.style.display = video.style.display === 'none' ? '' : 'none';
  camaraViva = video.style.display !== 'none' && !!stream;
  e.target.textContent = camaraViva ? 'Fondo negro' : 'Ver cámara';
});

/* ---------- LOOP ---------- */
function animate(){
  requestAnimationFrame(animate);
  if (testigo.parent){ testigo.rotation.y += 0.01; testigo.rotation.x += 0.005; }
  renderer.render(scene, camera);
}
animate();

function ajustar(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', ajustar);
addEventListener('orientationchange', () => setTimeout(ajustar, 350));
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && video.srcObject) video.play().catch(() => {});
});
</script>
